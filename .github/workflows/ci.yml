name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version-file: .sdkmanrc
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode verify
